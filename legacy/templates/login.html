{% extends "base.html" %}
{% block title %}Đăng nhập · AI Recruitment{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="card login-card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 text-center mb-2">Đăng nhập</h1>
            <p class="text-muted text-center mb-4">Hệ thống quản lý tuyển dụng</p>
            <form method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" value="{{ email|default('') }}" autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input class="form-control" id="password" name="password" type="password">
                </div>
                <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
